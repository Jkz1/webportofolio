
name: Deploy Portfolio

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Bintang Server
    runs-on: [self-hosted, Linux, X64, portfolio]
    timeout-minutes: 30

    steps:
      - name: Deploy Portfolio
        run: |
          sudo -n /usr/local/sbin/deploy-portfolio
